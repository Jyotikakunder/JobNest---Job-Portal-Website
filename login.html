<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }
        a {
            text-decoration: none;
        }
        nav {
            width: 100%;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 7%;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .logo {
            font-size: 27px;
            font-weight: 700;
            color: #2563eb;
        }
        .logo i {
            margin-right: 7px;
        }
        .back-home {
            color: #475569;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }
        .back-home:hover {
            color: #2563eb;
        }
        .back-home i {
            margin-right: 6px;
        }
        .login-section {
            min-height: calc(100vh - 76px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }
        .login-container {
            width: 100%;
            max-width: 450px;
        }
        .login-card {
            background: #ffffff;
            padding: 42px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }
        .login-icon {
            width: 65px;
            height: 65px;
            background: #dbeafe;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 26px;
        }
        .login-heading {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-heading h1 {
            font-size: 29px;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .login-heading p {
            color: #64748b;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 8px;
        }
        .input-box {
            position: relative;
        }
        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
        }
        .input-box input {
            width: 100%;
            padding: 13px 15px 13px 43px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: #1e293b;
            transition: 0.3s;
        }
        .input-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #64748b;
            font-size: 12px;
        }
        .remember input {
            accent-color: #2563eb;
        }
        .forgot {
            color: #2563eb;
            font-size: 12px;
            font-weight: 500;
        }
        .forgot:hover {
            text-decoration: underline;
        }
        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .login-button i {
            margin-right: 7px;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        .signup-text {
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
        .signup-text a {
            color: #2563eb;
            font-weight: 600;
        }
        .signup-text a:hover {
            text-decoration: underline;
        }
        .role-info {
            margin-top: 25px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .role-info i {
            color: #2563eb;
            margin-top: 3px;
        }
        .role-info p {
            font-size: 11px;
            color: #64748b;
            line-height: 1.6;
        }
        .role-info strong {
            color: #334155;
        }
        footer {
            text-align: center;
            padding: 18px;
            color: #94a3b8;
            font-size: 11px;
        }
        @media (max-width: 600px) {
            nav {
                padding: 16px 5%;
            }
            .logo {
                font-size: 23px;
            }
            .login-section {
                padding: 35px 15px;
            }
            .login-card {
                padding: 30px 22px;
            }
            .login-heading h1 {
                font-size: 25px;
            }
            .form-options {
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="home.html" class="logo"><i class="fa-solid fa-briefcase"></i> JobNest</a>
        <a href="home.html" class="back-home"><i class="fa-solid fa-arrow-left"></i>Back to Home</a>
    </nav>
    <section class="login-section">
        <div class="login-container">
            <div class="login-card">
                <div class="login-icon"><i class="fa-solid fa-user"></i></div>
                <div class="login-heading">
                    <h1>Welcome Back!</h1>
                    <p>Login to continue your JobNest journey.</p>
                </div>
                <form>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-box">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" placeholder="Enter your email address" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember"><input type="checkbox">Remember me</label>
                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>
                    <button type="submit" class="login-button">
                        <i class="fa-solid fa-right-to-bracket"></i>Login
                    </button>
                </form>
                <div class="divider">OR</div>
                <div class="signup-text">
                    Don't have an account?
                    <a href="signup.html">Create an Account</a>
                </div>
                <div class="role-info">
                    <i class="fa-solid fa-circle-info"></i>
                    <p>
                        <strong>Candidate?</strong>
                        Login to search and apply for jobs.<br>
                        <strong>Employer?</strong>
                        Login to manage your job postings and find candidates.
                    </p>
                </div>
            </div>
        </div>
    </section>
    <footer> © 2026 JobNest. All Rights Reserved.</footer>
</body>
</html>
