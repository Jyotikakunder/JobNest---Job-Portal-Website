<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | JobNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }
        a {
            text-decoration: none;
        }
        nav {
            width: 100%;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 7%;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .logo {
            font-size: 27px;
            font-weight: 700;
            color: #2563eb;
        }
        .logo i {
            margin-right: 7px;
        }
        .back-home {
            color: #475569;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }
        .back-home:hover {
            color: #2563eb;
        }
        .back-home i {
            margin-right: 6px;
        }
        .signup-section {
            min-height: calc(100vh - 76px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }
        .signup-container {
            width: 100%;
            max-width: 500px;
        }
        .signup-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }
        .signup-icon {
            width: 65px;
            height: 65px;
            background: #dbeafe;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 18px;
            font-size: 25px;
        }
        .signup-heading {
            text-align: center;
            margin-bottom: 27px;
        }
        .signup-heading h1 {
            font-size: 29px;
            color: #0f172a;
            margin-bottom: 7px;
        }
        .signup-heading p {
            color: #64748b;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 7px;
        }
        .input-box {
            position: relative;
        }
        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
        }
        .input-box input {
            width: 100%;
            padding: 12px 15px 12px 43px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: #1e293b;
            transition: 0.3s;
        }
        .input-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }
        .role-title {
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 9px;
        }
        .role-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .role-option {
            position: relative;
        }
        .role-option input {
            position: absolute;
            opacity: 0;
        }
        .role-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            cursor: pointer;
            color: #64748b;
            font-size: 12px;
            transition: 0.3s;
        }
        .role-option label i {
            font-size: 22px;
        }
        .role-option input:checked + label {
            border-color: #2563eb;
            background: #eff6ff;
            color: #2563eb;
        }
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 22px;
        }
        .terms input {
            margin-top: 4px;
            accent-color: #2563eb;
        }
        .terms label {
            color: #64748b;
            font-size: 11px;
            line-height: 1.6;
        }
        .terms a {
            color: #2563eb;
            font-weight: 500;
        }
        .signup-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .signup-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .signup-button i {
            margin-right: 7px;
        }
        .login-text {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #64748b;
        }
        .login-text a {
            color: #2563eb;
            font-weight: 600;
        }
        .login-text a:hover {
            text-decoration: underline;
        }
        .info-box {
            margin-top: 22px;
            padding: 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .info-box i {
            color: #2563eb;
            margin-top: 3px;
        }
        .info-box p {
            color: #64748b;
            font-size: 11px;
            line-height: 1.6;
        }
        footer {
            text-align: center;
            padding: 17px;
            color: #94a3b8;
            font-size: 11px;
        }
        @media (max-width: 600px) {
            nav {
                padding: 16px 5%;
            }
            .logo {
                font-size: 23px;
            }
            .signup-section {
                padding: 30px 15px;
            }
            .signup-card {
                padding: 30px 22px;
            }
            .signup-heading h1 {
                font-size: 25px;
            }
            .role-options {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="home.html" class="logo"><i class="fa-solid fa-briefcase"></i>JobNest</a>
        <a href="home.html" class="back-home"><i class="fa-solid fa-arrow-left"></i>Back to Home</a>
    </nav>
    <section class="signup-section">
        <div class="signup-container">
            <div class="signup-card">
                <div class="signup-icon"><i class="fa-solid fa-user-plus"></i></div>
                <div class="signup-heading">
                    <h1>Create Your Account</h1>
                    <p>oin JobNest and discover new opportunities.</p>
                </div>
                <form>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-box">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="name" placeholder="Enter your full name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-box">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" placeholder="Enter your email address" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Create a password" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                        </div>
                    </div>
                    <div class="role-title">Select Your Role</div>
                    <div class="role-options">
                        <div class="role-option">
                            <input type="radio" id="candidate" name="role" checked>
                            <label for="candidate"><i class="fa-solid fa-user"></i>Candidate</label>
                        </div>
                        <div class="role-option">
                            <input type="radio" id="employer" name="role">
                            <label for="employer"><i class="fa-solid fa-building"></i>Employer</label>
                        </div>
                    </div>
                    <div class="terms">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>.
                        </label>
                    </div>
                    <button type="submit" class="signup-button">
                        <i class="fa-solid fa-user-plus"></i>
                        Create Account
                    </button>
                </form>
                <div class="login-text">
                    Already have an account?
                    <a href="login.html">Login Here</a>
                </div>
                <div class="info-box">
                    <i class="fa-solid fa-circle-info"></i>
                    <p>
                        <strong>Candidate:</strong>
                        Search and apply for jobs.
                        <br>
                        <strong>Employer:</strong>
                        Post jobs and connect with talented candidates.
                    </p>
                </div>
            </div>
        </div>
    </section>
    <footer>© 2026 JobNest. All Rights Reserved.</footer>
</body>
</html>
